[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpe-mod-manager"
version = "0.1.0"
description = "Gestor de mods para MCPE Launcher en Linux"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "packaging>=23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3"]

[project.scripts]
mcpemod = "mcpemod.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
