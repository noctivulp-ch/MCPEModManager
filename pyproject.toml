[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpe-mod-manager"
version = "0.1.0"
description = "Gestor de packs, addons y mundos de Minecraft Bedrock para mcpelauncher en Linux"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "NoctiVulp" }]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "packaging>=23",
    "wulf-qt @ git+https://github.com/noctivulp-ch/wulfenite_ui.git#subdirectory=PyQT",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3"]

[project.scripts]
mcpemod = "mcpemod.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
